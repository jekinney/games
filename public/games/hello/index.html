<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: #000; color: #0f0;
    font: 14px "Courier New", monospace; text-align: center; padding: 12px;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: 3px; }
  button {
    font: inherit; color: #000; background: #0f0; border: 0;
    padding: 8px 16px; cursor: pointer;
  }
  button:hover { background: #fff; }
  #score { font-size: 30px; font-weight: bold; }
  #out { min-height: 1.4em; color: #6f6; font-size: 12px; }
  #best { color: #690; font-size: 12px; }
</style>
</head>
<body>

<h1>HELLO</h1>
<p>Not a game — a test of the plugin system and the SDK.</p>

<div id="score">0</div>
<button id="tap">Tap for points</button>
<button id="over">End game</button>

<p id="out"></p>
<p id="best"></p>

<script src="/assets/arcade-sdk.js"></script>
<script>
  var score = 0;
  var ended = false;

  var scoreEl = document.getElementById('score');
  var outEl = document.getElementById('out');

  document.getElementById('tap').addEventListener('click', function () {
    if (ended) return;
    score += Math.floor(Math.random() * 90) + 10;
    scoreEl.textContent = score;
    Arcade.setScore(score);          // live score in the shell header
  });

  document.getElementById('over').addEventListener('click', function () {
    if (ended) return;
    ended = true;
    outEl.textContent = 'submitting ' + score + '…';

    Arcade.submitScore(score).then(function (result) {
      if (!result) { outEl.textContent = 'no reply from the shell'; return; }
      outEl.textContent = result.accepted
        ? 'you placed #' + result.rank + '!'
        : 'no board spot this time';
    });
  });

  // Show the current record on the "title screen".
  Arcade.getHighScores().then(function (scores) {
    document.getElementById('best').textContent = scores.length
      ? 'record: ' + scores[0].initials + ' ' + scores[0].score
      : 'no scores yet — the board is yours';
  });

  Arcade.ready();
</script>

</body>
</html>
