<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asteroids</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 14px "Courier New", Courier, monospace; color: #fff;
    overflow: hidden;
  }
  #wrap { position: relative; height: 100%; aspect-ratio: 4/3; max-width: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 16px;
    background: rgba(0,0,0,.75);
  }
  #overlay[hidden] { display: none; }
  #overlay h1 { margin: 0; font-size: 28px; letter-spacing: 6px; }
  #overlay p  { margin: 0; font-size: 13px; }
  .dim   { color: #888; }
  .blink { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="board" width="480" height="360"></canvas>
  <div id="overlay">
    <h1>ASTEROIDS</h1>
    <p class="dim" id="record">&nbsp;</p>
    <p id="ov-sub" class="dim">&nbsp;</p>
    <p id="ov-hint" class="blink">PRESS SPACE TO START</p>
    <p class="dim">&larr; &rarr; to rotate &middot; &uarr; to thrust &middot; SPACE fires</p>
  </div>
</div>

<script src="/assets/arcade-sdk.js"></script>
<script src="asteroids.js"></script>
</body>
</html>
