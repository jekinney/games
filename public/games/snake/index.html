<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 14px "Courier New", Courier, monospace; color: #0f0;
    overflow: hidden;
  }
  #wrap { position: relative; height: 100%; aspect-ratio: 1; max-width: 100%; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 16px;
    background: rgba(0, 0, 0, .8);
  }
  #overlay[hidden] { display: none; }
  #overlay h1 { margin: 0; font-size: 26px; letter-spacing: 5px; }
  #overlay p { margin: 0; font-size: 13px; }
  .dim { color: #6a6; }
  .big { font-size: 30px; font-weight: bold; color: #fff; }
  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="board" width="400" height="400"></canvas>
  <div id="overlay">
    <h1>SNAKE</h1>
    <p class="dim" id="record">&nbsp;</p>
    <p class="blink">PRESS SPACE TO START</p>
    <p class="dim">arrows or WASD &middot; P pauses</p>
  </div>
</div>

<script src="/assets/arcade-sdk.js"></script>
<script src="snake.js"></script>
</body>
</html>
